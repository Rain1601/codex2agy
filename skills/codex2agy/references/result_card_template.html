<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .font-editorial {
      font-family: ui-serif, Georgia, Cambria, "New York", "Songti SC", "STSong", "Noto Serif SC", serif;
    }
    .thin-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .thin-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .thin-scroll::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--muted-foreground) 22%, transparent);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0">
  <div id="app" class="py-2.5 px-1 space-y-4 text-xs select-none"></div>

  <script>
    // Replace __RESULT_JSON__ with the JSON output from apply_migration.py,
    // and __LANG__ with "zh" or "en".
    const RESULT = __RESULT_JSON__;
    const LANG = "__LANG__";

    const I18N = {
      zh: {
        committed: "迁移已完成",
        dry_run: "演练预览（未写入）",
        interrupted_rolled_back: "已中断并自动回滚",
        failed_rolled_back: "执行异常 · 已自动回滚",
        created: "新增同步",
        projects: "项目与会话",
        skipped: "防重跳过",
        warnings: "提示项",
        tabCreated: "技能与配置",
        tabProjects: "项目会话",
        tabSkipped: "已跳过",
        empty: "当前分类下无记录",
        copyUndo: "复制撤回命令",
        copied: "已复制",
        archived: "已归档",
        kindLabels: {
          plugin_manifest: "MANIFEST",
          rule: "RULE",
          prompt_skill: "PROMPT",
          skill: "SKILL",
          memory_rule: "MEMORY",
          memory_lookup_skill: "LOOKUP",
          mcp: "MCP",
          agy_project: "PROJECT",
          project_thread: "SESSION"
        }
      },
      en: {
        committed: "Migration Complete",
        dry_run: "Dry Run Preview",
        interrupted_rolled_back: "Interrupted · Rolled Back",
        failed_rolled_back: "Failed · Rolled Back",
        created: "Newly Synced",
        projects: "Projects & Sessions",
        skipped: "Duplicates Skipped",
        warnings: "Notices",
        tabCreated: "Skills & Config",
        tabProjects: "Projects & Sessions",
        tabSkipped: "Skipped",
        empty: "Nothing in this view",
        copyUndo: "Copy undo command",
        copied: "Copied",
        archived: "archived",
        kindLabels: {
          plugin_manifest: "MANIFEST",
          rule: "RULE",
          prompt_skill: "PROMPT",
          skill: "SKILL",
          memory_rule: "MEMORY",
          memory_lookup_skill: "LOOKUP",
          mcp: "MCP",
          agy_project: "PROJECT",
          project_thread: "SESSION"
        }
      }
    };

    const t = I18N[LANG === "zh" ? "zh" : "en"];
    const created = (RESULT.created || []).filter(x => x.kind !== "plugin_manifest");
    const skipped = [...(RESULT.skipped_existing || []), ...(RESULT.skipped_idempotent || [])];
    const warnings = RESULT.warnings || [];
    const projCreated = created.filter(x => x.kind === "agy_project" || x.kind === "project_thread");
    const otherCreated = created.filter(x => x.kind !== "agy_project" && x.kind !== "project_thread");
    const status = RESULT.status || "committed";

    // Restrained Anthropic terracotta accent (#D97757) for active/healthy state; muted amber for rollback
    const accentHex = (status === "committed" || status === "dry_run") ? "#D97757" : "#C98A42";
    const undoCmd = `codex2agy undo --run-id ${RESULT.run_id || ""}`;
    let activeTab = otherCreated.length ? "created" : (projCreated.length ? "projects" : "skipped");

    function esc(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderRows(items, mode) {
      if (!items.length) {
        return `<div class="py-7 text-center text-[var(--muted-foreground)] opacity-70 italic font-editorial text-sm">${t.empty}</div>`;
      }
      return items.slice(0, 50).map(item => {
        const label = t.kindLabels[item.kind] || String(item.kind || "").toUpperCase();
        const title = item.title || item.name || item.thread_id || item.path || "";
        const meta = mode === "skipped"
          ? (item.reason || "")
          : (item.project ? `${item.project}${item.archived ? ` · ${t.archived}` : ""}` : "");
        return `
          <div class="group flex items-baseline justify-between gap-4 px-2.5 py-1.5 rounded-lg hover:bg-[var(--secondary)]/40 transition-colors">
            <div class="flex items-baseline gap-3 min-w-0">
              <span class="shrink-0 w-16 font-mono text-[10px] tracking-wider text-[var(--muted-foreground)] opacity-75">${esc(label)}</span>
              <span class="truncate text-[13px] text-[var(--foreground)]" title="${esc(title)}">${esc(title)}</span>
            </div>
            ${meta ? `<span class="shrink-0 text-[11px] text-[var(--muted-foreground)] opacity-75 truncate max-w-[180px]">${esc(meta)}</span>` : ""}
          </div>
        `;
      }).join("");
    }

    function render() {
      const tabData = activeTab === "created" ? otherCreated : activeTab === "projects" ? projCreated : skipped;
      const metrics = [
        [t.created, created.length, true],
        [t.projects, projCreated.length, false],
        [t.skipped, skipped.length, false],
        ...(warnings.length ? [[t.warnings, warnings.length, false]] : [])
      ];

      document.getElementById("app").innerHTML = `
        <div class="rounded-2xl bg-[var(--card)]/65 px-5 py-4 space-y-4">
          <!-- Editorial Header -->
          <div class="flex items-baseline justify-between gap-3">
            <div class="flex items-baseline gap-2.5 min-w-0">
              <span class="inline-block w-2 h-2 rounded-full shrink-0 translate-y-[-1px]" style="background:${accentHex}"></span>
              <h3 class="font-editorial text-[17px] font-normal tracking-tight text-[var(--foreground)] truncate">
                ${esc(t[status] || status)}
              </h3>
              <span class="font-mono text-[11px] text-[var(--muted-foreground)] opacity-65 truncate">${esc(RESULT.run_id || "")}</span>
            </div>
            <button id="copyBtn" title="${esc(undoCmd)}" class="shrink-0 font-mono text-[11px] text-[var(--muted-foreground)] hover:text-[var(--foreground)] px-2 py-0.5 rounded-md hover:bg-[var(--secondary)]/50 transition cursor-pointer">
              ${t.copyUndo}
            </button>
          </div>

          <!-- Editorial Serif Figures -->
          <div class="flex flex-wrap items-baseline gap-x-8 gap-y-2 pt-0.5">
            ${metrics.map(([label, val, highlight]) => `
              <div class="flex items-baseline gap-2">
                <span class="font-editorial text-[26px] leading-none font-normal tabular-nums tracking-tight" style="${highlight ? `color:${accentHex}` : ""}">
                  ${val}
                </span>
                <span class="text-[11px] text-[var(--muted-foreground)]">${esc(label)}</span>
              </div>
            `).join("")}
          </div>

          <!-- Minimalist Text Tabs with Warm Terracotta Indicator -->
          <div class="flex items-center gap-5 pt-1">
            ${[
              ["created", t.tabCreated, otherCreated.length],
              ["projects", t.tabProjects, projCreated.length],
              ["skipped", t.tabSkipped, skipped.length]
            ].map(([key, label, cnt]) => {
              const active = activeTab === key;
              return `
                <button data-tab="${key}" class="tab-btn relative pb-1.5 text-[12px] transition cursor-pointer ${
                  active
                    ? "text-[var(--foreground)] font-medium"
                    : "text-[var(--muted-foreground)] opacity-65 hover:opacity-100"
                }">
                  <span>${esc(label)}</span>
                  <span class="font-mono text-[10px] opacity-60 ml-1 tabular-nums">${cnt}</span>
                  ${active ? `<span class="absolute left-0 right-0 bottom-0 h-[1.5px] rounded-full" style="background:${accentHex}"></span>` : ""}
                </button>
              `;
            }).join("")}
          </div>

          <!-- Quiet Editorial Item List -->
          <div class="thin-scroll max-h-[164px] overflow-y-auto -mx-2.5 px-0.5 space-y-0.5">
            ${renderRows(tabData, activeTab)}
          </div>
        </div>
      `;

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeTab = btn.getAttribute("data-tab");
          render();
        });
      });

      const copyBtn = document.getElementById("copyBtn");
      if (copyBtn) {
        copyBtn.addEventListener("click", () => {
          navigator.clipboard && navigator.clipboard.writeText(undoCmd);
          copyBtn.textContent = t.copied;
          copyBtn.style.color = accentHex;
          setTimeout(() => {
            copyBtn.textContent = t.copyUndo;
            copyBtn.style.color = "";
          }, 1500);
        });
      }
    }

    render();
  </script>
</body>
</html>
